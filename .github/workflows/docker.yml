name: Build and Push image

on:
  workflow_dispatch:
  push:
    tags:
    - 'v*'

jobs:
  build-scan-push:
    name: Build, Scan and Push image
    runs-on: ubuntu-latest

    steps:

    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4
      with:
        driver: docker-container

    - name: Docker metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository_owner }}/weatherapp
        flavor: latest=false
        tags: |
          type=sha,prefix=sha-,format=short
          type=semver,pattern={{version}}

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: ${{ vars.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build image for CVE scan
      uses: docker/build-push-action@v7
      with:
        context: .
        load: true
        tags: local-test-image:latest

    - name: Scan image with Trivy
      uses: aquasecurity/trivy-action@0.36.0
      with:
        image-ref: local-test-image:latest
        format: table
        severity: HIGH,CRITICAL
        exit-code: 1

    - name: Build and push multiarch image
      uses: docker/build-push-action@v7
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        cache-from: |
          type=registry,ref=pawel19/cache:buildcache
        cache-to: |
          type=registry,ref=pawel19/cache:buildcache,mode=max
        tags: ${{ steps.meta.outputs.tags }}
